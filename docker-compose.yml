services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}      # Суперпользователь (создает БД)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_SCHEMA: ${POSTGRES_SCHEMA}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d
      - ./configs/postgresql.conf:/etc/postgresql/postgresql.conf # Подключаем конфиг
      - ./pg_logs:/var/log/postgresql # Папка для логов (для PGBadger)
    command: postgres -c 'config_file=/etc/postgresql/postgresql.conf' # Запуск с конфигом
    networks:
      - main
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- МОНИТОРИНГ ---
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter
    environment:
      # Экспортер подключается как суперюзер, чтобы видеть всю статистику
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - main
    depends_on:
      db:
        condition: service_healthy

  prometheus:
    image: prom/prometheus
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - main
    depends_on:
      - postgres-exporter

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    networks:
      - main
    depends_on:
      - prometheus

  # --- МИКРОСЕРВИСЫ ---
  
  ad-service:
    build:
      context: .
      dockerfile: internal/service/ad/build/Dockerfile
    container_name: ad_service
    restart: always
    ports:
      - "${GRPC_AD_PORT}:${GRPC_AD_PORT}"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT}
      # ВАЖНО: Используем сервисного пользователя, а не root (из задания)
      POSTGRES_USER: app_user 
      POSTGRES_PASSWORD: strong_password_123 
      POSTGRES_DB: ${POSTGRES_DB}
      APP_PORT: ${GRPC_AD_PORT}
    networks:
      - main
    depends_on:
      db:
        condition: service_healthy

  auth:
    build:
      context: .
      dockerfile: internal/service/auth/build/Dockerfile
    container_name: auth_service
    restart: always
    ports:
      - "${GRPC_PORT_AUTH}:${GRPC_PORT_AUTH}"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT}
      # ВАЖНО: Используем сервисного пользователя
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: strong_password_123
      POSTGRES_DB: ${POSTGRES_DB}
      APP_PORT: ${GRPC_PORT_AUTH}
    networks:
      - main
    depends_on:
      db:
        condition: service_healthy

  profile:
    build:
      context: .
      dockerfile: internal/service/profile/build/Dockerfile
    container_name: profile_service
    dns:
      - 8.8.8.8
    restart: always
    ports:
      - "${GRPC_PORT_PROFILE}:${GRPC_PORT_PROFILE}"
    environment:
      # ВАЖНО: Используем сервисного пользователя
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: strong_password_123
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT}
      APP_PORT: ${GRPC_PORT_PROFILE}
      AUTH_ADDR: auth_service:${GRPC_PORT_AUTH} 
    networks:
      - main
    depends_on:
      - db
      - auth 
  
  storage:
    build:
      context: .
      dockerfile: internal/service/storage/build/Dockerfile
    container_name: storage_service
    restart: always
    ports:
      - "${GRPC_STORAGE_PORT}:${GRPC_STORAGE_PORT}"
    environment:
      APP_PORT: ${GRPC_STORAGE_PORT}
      GRPC_PORT_AUTH: ${GRPC_PORT_AUTH}
    networks:
      - main

  slot-service:
    build:
      context: .
      dockerfile: internal/service/slot/build/Dockerfile
    container_name: slot_service
    restart: always
    ports:
      - "${GRPC_PORT_SLOT}:${GRPC_PORT_SLOT}"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT}
      # ВАЖНО: Используем сервисного пользователя
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: strong_password_123
      POSTGRES_DB: ${POSTGRES_DB}
      PORT_SLOT: ${GRPC_PORT_SLOT}
    networks:
      - main
    depends_on:
      db:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: cmd/gateway/Dockerfile
    ports:
      - "${APP_PORT}:${APP_PORT}" 
    environment:
      AUTH_ADDR: auth_service:${GRPC_PORT_AUTH}
      PROFILE_ADDR: profile_service:${GRPC_PORT_PROFILE}
      AD_ADDR: ad_service:${GRPC_AD_PORT}
      STORAGE_ADDR: storage_service:${GRPC_STORAGE_PORT}
      SLOT_ADDR: slot-service:${GRPC_PORT_SLOT}
      APP_PORT: ${APP_PORT}
    networks:
      - main
    depends_on:
      - auth
      - profile
      - ad-service
      - storage
      - slot-service

networks:
  main: