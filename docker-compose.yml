services:
  db:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_SCHEMA: ${POSTGRES_SCHEMA}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - main
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    

  # app:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   restart: always
  #   ports:
  #     - "${APP_PORT}:${APP_PORT}"
  #   depends_on:
  #     - db
  ad-service:
    build:
      context: .
      dockerfile: internal/service/ad/build/Dockerfile
    container_name: ad_service
    restart: always
    ports:
      - "${GRPC_AD_PORT}:${GRPC_AD_PORT}"
    networks:
      - main
    depends_on:
      db:
        condition: service_healthy
  auth:
    build:
      context: .
      dockerfile: internal/service/auth/build/Dockerfile
    container_name: auth_service
    restart: always
    ports:
      - "${GRPC_PORT_AUTH}:${GRPC_PORT_AUTH}"
    networks:
      - main
    depends_on:
      db:
        condition: service_healthy

  profile:
    build:
      context: .
      dockerfile: internal/service/profile/build/Dockerfile
    container_name: profile_service
    restart: always
    ports:
      - "${GRPC_PORT_PROFILE}:${GRPC_PORT_PROFILE}"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      GRPC_PORT_AUTH: ${GRPC_PORT_PROFILE}
    networks:
      - main
    depends_on:
      - db
  
  storage:
    build:
      context: .
      dockerfile: internal/service/storage/build/Dockerfile
    container_name: storage_service
    restart: always
    ports:
      - "${GRPC_STORAGE_PORT}:${GRPC_STORAGE_PORT}"
    environment:
      GRPC_STORAGE_PORT: ${GRPC_STORAGE_PORT}
    networks:
      - main

networks:
  main:
