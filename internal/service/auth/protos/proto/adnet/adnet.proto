syntax="proto3";

package auth;

option go_package = "adnet.v1;adnetv1";

service Auth {
    rpc Register(RegistetRequest) returns (RegisterResponse);
    rpc Login(LoginRequest) returns (LoginResponse); 
}

message RegistetRequest {
    string login = 1;
    string email = 2;
    string password = 3;
}

message RegisterResponse {
    int64 user_id = 1;
}

message LoginRequest {
    string email = 1;
    string password = 2;
}

message LoginResponse {
    string token = 1;
}